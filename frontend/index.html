<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Dashboard</title>
    <!-- File CSS -->
    <link rel="stylesheet" href="style.css">
    <!-- Tải thư viện Chart.js từ CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
    <div class="dashboard-container">
        <h1 class="header-title">Weather Dashboard</h1>

        <!-- Thanh tìm kiếm -->
        <div class="search-box">
            <input type="text" id="city" placeholder="Nhập tên thành phố (vd: Hanoi, Tokyo)...">
            <button id="search" onclick="timThoiTiet()">Tìm kiếm</button>
        </div>

        <!-- Trạng thái Loading -->
        <div id="loading" class="loading-state" style="display: none;">
            ⏳ Đang tải dữ liệu...
        </div>

        <!-- Thông báo lỗi (Màu đỏ mờ) -->
        <div id="error-message" class="error-state" style="display: none;"></div>

        <!-- Khung chứa dữ liệu thời tiết (Sẽ bị ẩn/xóa khi có lỗi) -->
        <div id="weather-content" class="weather-content" style="display: none;">
            <!-- PHẦN 1: Tổng quan thời tiết -->
            <div class="weather-overview">
                <h2 id="city-name" class="city-name">Thành phố: ...</h2>
                <div class="temp-display"><span id="temp">...</span>°C</div>
                <p id="condition" class="condition-badge">...</p>
            </div>

            <!-- PHẦN 2: Lưới 4 chỉ số phụ -->
            <div class="metrics-grid">
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">💧</span>
                        <span>Độ ẩm</span>
                    </div>
                    <div class="metric-value">
                        <span id="humidity">...</span><span class="metric-unit">%</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">🌧️</span>
                        <span>Lượng mưa</span>
                    </div>
                    <div class="metric-value">
                        <span id="precip">...</span><span class="metric-unit">mm</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">☀️</span>
                        <span>Chỉ số UV</span>
                    </div>
                    <div class="metric-value">
                        <span id="uv">...</span>
                    </div>
                </div>
                <div class="metric-card">
                    <div class="metric-header">
                        <span class="metric-icon">🍃</span>
                        <span>Chất lượng KK (AQI)</span>
                    </div>
                    <div class="metric-value">
                        <span id="aqi">...</span>
                    </div>
                </div>
            </div>

            <!-- PHẦN 3: Biểu đồ nhiệt độ theo giờ (Chart.js) -->
            <div>
                <h3 class="section-title">📈 Nhiệt độ theo giờ (hôm nay)</h3>
                <div class="chart-wrapper">
                    <canvas id="hourlyChart"></canvas>
                </div>
            </div>

            <!-- PHẦN 4: Dự báo 7 ngày -->
            <div>
                <h3 class="section-title">📅 Dự báo 7 ngày tới</h3>
                <div id="forecast-list" class="forecast-list">
                    <!-- Các forecast-card sẽ được render động bằng JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- File JavaScript -->
    <script src="app.js"></script>
</body>
</html>
